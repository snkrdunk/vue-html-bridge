name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build, typecheck, test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Matches the root package.json's supported engines. Node 20 was
        # dropped (2026-08-25): pnpm 11 requires Node >=22.13 (it moved its
        # store index to node:sqlite, a Node 22+ builtin), so a pnpm-11
        # toolchain can no longer run under Node 20 at all — and Node 20's
        # own LTS maintenance window had already ended (2026-04-30).
        # Markuplint is pinned to a single version (^4.18.3, ADR-0003) —
        # adapter-markuplint.md §9.2 item 13's version-matrix dimension is
        # deliberately deferred to Phase 3, when a second supported major
        # exists to matrix against (monorepo.md §8 "CI matrix" policy).
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      - run: pnpm run typecheck

      - run: pnpm run test

  lint:
    name: lint, format, dependency graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint

      - run: pnpm run format:check

      - run: pnpm run check:deps
